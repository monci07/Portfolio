<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Curriculum vitae</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <label id="commit-filter">
      Show commits until:
      <input id="commit-progress" type="range" min="0" max="100" />
      <time id="commit-time"></time>
    </label>
    <div id="stats">
      <h2>Summary</h2>
    </div>
    <h2>Commits by time of day</h2>
    <div id="scrolly-1">
	  <div id="scatter-story"></div>

	  <div id="chart"></div>
      <dl id="commit-tooltip" class="info tooltip" hidden>
	      <dt>Commit</dt>
      	  <dd>
        	<a href="" id="commit-link" target="_blank"></a>
      	  </dd>
		  <dt>Date</dt>
      	  <dd id="commit-date"></dd>
      </dl>
	</div>
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>
    <dl id="files">
      <!-- we want the following structure for each file:
  <div>
    <dt>
      <code>{file.name}</code>
    </dt>
    <dd>{file.lines.length} lines</dd>
  </div>
  -->
    </dl>
  </body>
</html>
